description: Vectren is a regulated utility brand operated under CenterPoint Energy. Energy delivery is
  priced by tariff filed with state utility commissions, not as a SaaS or API plan. There is no public
  developer plan, no API marketplace, and no published API pricing for Vectren / CenterPoint customer-facing
  energy services.
sources:
  - https://www.centerpointenergy.com/
notes: 'Vectren is a regulated utility, not an API vendor. "Pricing" is governed by state-commission-approved
  tariffs and is out of scope for an API plans artifact. Reconciliation to a single Contact Sales placeholder
  to satisfy the schema; remove from API directories if no API surface is published.'
plans:
  - id: vectren-contact-utility
    name: Contact Utility
    type: enterprise
    description: No public API plans. Energy service is sold via tariff; any partner / data integrations
      are arranged directly with CenterPoint Energy.
    entries:
      - label: Tariff-Based Service
        name: tariff_service
        type: subscription
        metric: varies
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: see state utility commission tariff
        userMultiplied: false
    elements:
      - name: Customer Account Services
      - name: Outage Reporting
      - name: Billing
